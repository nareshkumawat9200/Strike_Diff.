name: Update bhavcopy data

on:
  schedule:
    # 14:00 UTC = 19:30 IST, after NSE publishes the day's bhavcopy (Mon-Fri).
    - cron: "0 14 * * 1-5"
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to commit data/latest.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build latest.json from NSE bhavcopy
        run: python repo_upload/scripts/build_data.py

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo_upload/data/latest.json
          if git diff --staged --quiet; then
            echo "No change - bhavcopy already up to date."
          else
            git commit -m "Update bhavcopy data ($(date -u +%Y-%m-%d))"
            git push
          fi
